<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Finance Dashboard</h1>
      <p class="subtitle">Track your income and expenses.</p>
      <p id="mode" class="mode" aria-live="polite"></p>
    </header>

    <section class="cards" aria-label="Summary">
      <div class="card"><span class="label">Income</span><strong id="income" class="positive">$0.00</strong></div>
      <div class="card"><span class="label">Expenses</span><strong id="expenses" class="negative">$0.00</strong></div>
      <div class="card"><span class="label">Balance</span><strong id="balance">$0.00</strong></div>
    </section>

    <section class="panel">
      <h2>Add transaction</h2>
      <div class="form" id="form">
        <input id="description" type="text" placeholder="Description" maxlength="60" aria-label="Description">
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" aria-label="Amount">
        <select id="type" aria-label="Type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <select id="category" aria-label="Category"></select>
        <input id="date" type="date" aria-label="Date">
        <button id="add" type="button">Add</button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>Transactions</h2>
        <div class="filters">
          <input id="month" type="month" aria-label="Month">
          <label><input id="all" type="checkbox"> All months</label>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
      <p id="empty" class="empty">No transactions yet. Add your first one above.</p>
      <div class="actions">
        <button id="export" type="button" class="secondary">Export CSV</button>
        <button id="clear" type="button" class="danger">Clear all data</button>
      </div>
    </section>

    <section class="panel">
      <h2>Expenses by category</h2>
      <div id="chart"></div>
      <p id="chart-empty" class="empty">No expenses in this period.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
